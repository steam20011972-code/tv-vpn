<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEDZH VPN</title><link rel="stylesheet" href="style.css"></head>
<body><div class="shell">
 <header><div class="brand"><svg class="mark" viewBox="0 0 100 100" aria-hidden="true"><path d="M14 82V22l36 38 36-38v60"/><circle class="node" cx="14" cy="82" r="11"/><circle class="hole" cx="86" cy="82" r="10"/></svg><span>MEDZH <b>VPN</b></span></div><div class="header-note" data-i18n="header.note"></div><span id="preview" hidden data-i18n="preview"></span></header>
 <main id="main" hidden>
  <section class="connection" aria-labelledby="state-title">
   <div id="status-pill" class="pill"><i></i><span id="pill-text" data-i18n="pill.checking"></span></div>
   <button id="power" class="power" data-i18n-aria="power.connect"><svg viewBox="0 0 100 100" aria-hidden="true"><path class="shield" d="M14 26Q14 12 28 12H72Q86 12 86 26V52Q86 76 50 92Q14 76 14 52Z"/><path class="glyph" d="M50 30V50M38 37A18 18 0 1 0 62 37"/><path class="check" d="M34 50L46 62L67 39"/></svg></button>
   <h1 id="state-title" data-i18n="state.wait"></h1>
   <p id="state-description" data-i18n="state.waitText"></p>
   <div id="connection-meta" class="connection-meta"></div>
  </section>
  <aside>
   <button id="profile-card" class="profile-card" data-i18n-aria="profiles.aria"><div class="eyebrow" data-i18n="profile.eyebrow"></div><div class="profile-row"><div class="server-icon"><svg class="mark" viewBox="0 0 100 100" aria-hidden="true"><path d="M14 82V22l36 38 36-38v60"/><circle class="node" cx="14" cy="82" r="11"/><circle class="hole" cx="86" cy="82" r="10"/></svg></div><div><h2 id="profile" data-i18n="profile.none"></h2><p id="profile-kind"></p></div><span class="profile-dot"></span><span class="chevron">›</span></div><div class="profile-bottom"><span data-i18n="profile.protection"></span><strong id="route-mode" data-i18n="route.checking"></strong></div></button>
   <button id="autostart" class="setting" aria-pressed="false"><span><strong data-i18n="autostart.title"></strong><small data-i18n="autostart.text"></small></span><span class="switch"><i></i></span></button>
   <button id="diagnostics" class="setting"><span><strong data-i18n="diag.title"></strong><small data-i18n="diag.text"></small></span><span class="chevron">›</span></button>
   <button id="restore" class="setting secondary"><span><strong data-i18n="restore.title"></strong><small data-i18n="restore.text"></small></span><span class="chevron"><svg class="undo" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></span></button>
   <p class="footnote"><span data-i18n="footnote.fallback"></span><br><span data-i18n="footnote.lan"></span></p>
  </aside>
 </main>
 <main id="setup-screen" class="setup" hidden>
  <section class="setup-card" aria-labelledby="setup-title">
   <div class="eyebrow" data-i18n="setup.eyebrow"></div>
   <h1 id="setup-title" data-i18n="setup.checking"></h1>
   <p id="setup-description" data-i18n="setup.checkingText"></p>
   <ul id="setup-checks" class="setup-checks"></ul>
   <button id="setup-install" class="dialog-button" data-action="check" data-i18n="setup.retry"></button>
  </section>
 </main>
 <footer><span><kbd>OK</kbd> <span data-i18n="footer.select"></span><span class="footer-gap"><kbd>← ↑ ↓ →</kbd> <span data-i18n="footer.move"></span></span></span><span><span data-i18n="footer.note"></span><span id="version" class="footer-gap"></span></span></footer>
</div>
<div id="dialog" class="dialog-backdrop" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="eyebrow">MEDZH VPN</div><h2 id="dialog-title"></h2><div id="dialog-content"></div><div id="dialog-actions" class="dialog-actions"></div></section></div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="vendor/qrcode.js"></script><script src="i18n.js"></script><script src="commands.js"></script><script src="app.js"></script></body></html>
