name: build

# Every push and pull request: tests and an IPK build (core hash checked against core.lock.json).
# A tag vX.Y.Z matching app/appinfo.json publishes a GitHub Release with the IPK and its .sha256.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Also downloads the pinned sing-box and verifies the archive, binary and license hashes.
      # Release tags must be signed (secret TVVPN_SIGNING_KEY); other builds are unsigned unless the secret is set.
      - name: Build
        env:
          TVVPN_SIGNING_KEY: ${{ secrets.TVVPN_SIGNING_KEY }}
        run: npm run build -- ${{ startsWith(github.ref, 'refs/tags/v') && '--require-signature' || '' }}
      - name: Check package checksum
        working-directory: dist
        run: sha256sum -c *.ipk.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ipk
          path: |
            dist/*.ipk
            dist/*.ipk.sha256
            dist/build.json
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag must match the app version
        run: |
          version=$(node -p "require('./app/appinfo.json').version")
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "Tag ${GITHUB_REF_NAME} does not match app version ${version}"; exit 1; }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ipk
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum -c *.ipk.sha256 && cd ..
          gh release create "${GITHUB_REF_NAME}" dist/*.ipk dist/*.ipk.sha256 \
            --title "MEDZH VPN ${GITHUB_REF_NAME}" --prerelease \
            --notes "Beta: tested on one TV model. Requires a rooted LG webOS TV with Homebrew Channel \"Root OK\". Check the download: sha256sum -c *.ipk.sha256"
