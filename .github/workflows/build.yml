name: build

# Every push and pull request: tests and an IPK build (core hash checked against core.lock.json).
# A tag vX.Y.Z matching app/appinfo.json publishes a GitHub Release with the IPK and its .sha256.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Also downloads the pinned sing-box and verifies the archive, binary and license hashes.
      - run: npm run build
      - name: Check package checksum
        working-directory: dist
        run: sha256sum -c *.ipk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ipk
          path: |
            dist/*.ipk
            dist/*.ipk.sha256
            dist/build.json
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the app version
        run: |
          version=$(node -p "require('./app/appinfo.json').version")
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "Tag ${GITHUB_REF_NAME} does not match app version ${version}"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: ipk
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum -c *.ipk.sha256 && cd ..
          gh release create "${GITHUB_REF_NAME}" dist/*.ipk dist/*.ipk.sha256 \
            --title "MEDZH VPN ${GITHUB_REF_NAME}" --prerelease \
            --notes "Beta: tested on one TV model. Requires a rooted LG webOS TV with Homebrew Channel \"Root OK\". Check the download: sha256sum -c *.ipk.sha256"
